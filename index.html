<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>후쿠오카 2박3일 여행</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
  /* Primitive Color Tokens */
  --color-white: rgba(255, 255, 255, 1);
  --color-black: rgba(0, 0, 0, 1);
  --color-cream-50: rgba(252, 252, 249, 1);
  --color-cream-100: rgba(255, 255, 253, 1);
  --color-gray-200: rgba(245, 245, 245, 1);
  --color-gray-300: rgba(167, 169, 169, 1);
  --color-gray-400: rgba(119, 124, 124, 1);
  --color-slate-500: rgba(98, 108, 113, 1);
  --color-brown-600: rgba(94, 82, 64, 1);
  --color-charcoal-700: rgba(31, 33, 33, 1);
  --color-charcoal-800: rgba(38, 40, 40, 1);
  --color-slate-900: rgba(19, 52, 59, 1);
  --color-teal-300: rgba(50, 184, 198, 1);
  --color-teal-400: rgba(45, 166, 178, 1);
  --color-teal-500: rgba(33, 128, 141, 1);
  --color-teal-600: rgba(29, 116, 128, 1);
  --color-teal-700: rgba(26, 104, 115, 1);
  --color-teal-800: rgba(41, 150, 161, 1);
  --color-red-400: rgba(255, 84, 89, 1);
  --color-red-500: rgba(192, 21, 47, 1);
  --color-orange-400: rgba(230, 129, 97, 1);
  --color-orange-500: rgba(168, 75, 47, 1);

  --color-brown-600-rgb: 94, 82, 64;
  --color-teal-500-rgb: 33, 128, 141;
  --color-slate-900-rgb: 19, 52, 59;
  --color-slate-500-rgb: 98, 108, 113;

  --color-bg-1: rgba(59, 130, 246, 0.08);
  --color-bg-2: rgba(245, 158, 11, 0.08);
  --color-bg-3: rgba(34, 197, 94, 0.08);
  --color-bg-4: rgba(239, 68, 68, 0.08);

  --color-background: var(--color-cream-50);
  --color-surface: var(--color-cream-100);
  --color-text: var(--color-slate-900);
  --color-text-secondary: var(--color-slate-500);
  --color-primary: var(--color-teal-500);
  --color-primary-hover: var(--color-teal-600);
  --color-border: rgba(var(--color-brown-600-rgb), 0.2);
  --color-card-border: rgba(var(--color-brown-600-rgb), 0.12);

  --font-family-base: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --font-size-base: 14px;
  --font-size-lg: 16px;
  --font-size-xl: 18px;
  --font-size-2xl: 20px;
  --font-size-3xl: 24px;
  --font-weight-medium: 500;
  --font-weight-semibold: 550;
  --font-weight-bold: 600;

  --space-8: 8px;
  --space-12: 12px;
  --space-16: 16px;
  --space-20: 20px;
  --space-24: 24px;
  --space-32: 32px;

  --radius-base: 8px;
  --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
}

@media (prefers-color-scheme: dark) {
  :root {
    --color-background: var(--color-charcoal-700);
    --color-surface: var(--color-charcoal-800);
    --color-text: var(--color-gray-200);
    --color-text-secondary: rgba(167, 169, 169, 0.7);
    --color-primary: var(--color-teal-300);
    --color-primary-hover: var(--color-teal-400);
    --color-border: rgba(119, 124, 124, 0.3);
    --color-card-border: rgba(119, 124, 124, 0.2);
  }
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--font-family-base);
  background-color: var(--color-background);
  color: var(--color-text);
  line-height: 1.6;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: var(--space-20);
}

header {
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  padding: var(--space-24);
  margin-bottom: var(--space-24);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--color-card-border);
}

h1 {
  font-size: var(--font-size-3xl);
  font-weight: var(--font-weight-bold);
  margin-bottom: var(--space-12);
  color: var(--color-text);
}

.trip-dates {
  color: var(--color-text-secondary);
  font-size: var(--font-size-lg);
  display: flex;
  align-items: center;
  gap: var(--space-8);
  flex-wrap: wrap;
}

.trip-dates span {
  display: flex;
  align-items: center;
  gap: var(--space-8);
}

.tabs {
  display: flex;
  gap: var(--space-8);
  margin-bottom: var(--space-24);
  flex-wrap: wrap;
}

.tab {
  padding: var(--space-12) var(--space-24);
  background: var(--color-surface);
  border: 1px solid var(--color-card-border);
  border-radius: var(--radius-base);
  cursor: pointer;
  font-size: var(--font-size-base);
  font-weight: var(--font-weight-medium);
  color: var(--color-text);
  transition: all 0.2s;
}

.tab:hover {
  background: var(--color-bg-1);
  border-color: var(--color-primary);
}

.tab.active {
  background: var(--color-primary);
  color: white;
  border-color: var(--color-primary);
}

.main-content {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-24);
}

@media (max-width: 1024px) {
  .main-content {
    grid-template-columns: 1fr;
  }
}

.map-section {
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  padding: var(--space-20);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--color-card-border);
  height: 600px;
}

#map {
  height: 550px;
  border-radius: var(--radius-base);
}

.itinerary-section {
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  padding: var(--space-20);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--color-card-border);
}

.day-title {
  font-size: var(--font-size-2xl);
  font-weight: var(--font-weight-bold);
  margin-bottom: var(--space-20);
  color: var(--color-text);
}

.activity-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-16);
}

.activity-item {
  padding: var(--space-16);
  background: var(--color-background);
  border-radius: var(--radius-base);
  border: 1px solid var(--color-card-border);
  cursor: pointer;
  transition: all 0.2s;
}

.activity-item:hover {
  box-shadow: var(--shadow-md);
  border-color: var(--color-primary);
}

.activity-header {
  display: flex;
  align-items: flex-start;
  gap: var(--space-12);
  margin-bottom: var(--space-8);
}

.activity-icon {
  font-size: 24px;
  flex-shrink: 0;
}

.activity-content {
  flex: 1;
}

.activity-time {
  font-size: var(--font-size-base);
  color: var(--color-primary);
  font-weight: var(--font-weight-semibold);
  margin-bottom: var(--space-8);
}

.activity-title {
  font-size: var(--font-size-lg);
  font-weight: var(--font-weight-semibold);
  margin-bottom: var(--space-8);
  color: var(--color-text);
}

.activity-description {
  font-size: var(--font-size-base);
  color: var(--color-text-secondary);
  line-height: 1.5;
}

.activity-details {
  margin-top: var(--space-12);
  padding-top: var(--space-12);
  border-top: 1px solid var(--color-card-border);
  font-size: var(--font-size-base);
  color: var(--color-text-secondary);
  display: none;
}

.activity-item.expanded .activity-details {
  display: block;
}

.detail-row {
  margin-bottom: var(--space-8);
  display: flex;
  gap: var(--space-8);
}

.detail-label {
  font-weight: var(--font-weight-semibold);
  color: var(--color-text);
}

.legend {
  display: flex;
  gap: var(--space-16);
  margin-bottom: var(--space-16);
  flex-wrap: wrap;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: var(--space-8);
  font-size: var(--font-size-base);
}

.legend-line {
  width: 30px;
  height: 3px;
  border-radius: 2px;
}

.day-content {
  display: none;
}

.day-content.active {
  display: block;
}

.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: var(--font-weight-medium);
  background: var(--color-bg-2);
  color: var(--color-text);
  margin-left: var(--space-8);
}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🗾 후쿠오카 2박3일 여행 (수정)</h1>
      <div class="trip-dates">
        <span>📍 1/31 10:00 하카타 버스터미널</span>
        <span>→</span>
        <span>✈️ 2/2 08:00 후쿠오카 공항</span>
      </div>
    </header>

    <div class="tabs">
      <button class="tab active" data-day="1">Day 1: 1/31 (금)</button>
      <button class="tab" data-day="2">Day 2: 2/1 (토)</button>
      <button class="tab" data-day="3">Day 3: 2/2 (일)</button>
    </div>

    <div class="main-content">
      <div class="map-section">
        <div class="legend">
          <div class="legend-item">
            <div class="legend-line" style="background: #3b82f6;"></div>
            <span>Day 1</span>
          </div>
          <div class="legend-item">
            <div class="legend-line" style="background: #ef4444;"></div>
            <span>Day 2</span>
          </div>
          <div class="legend-item">
            <div class="legend-line" style="background: #22c55e;"></div>
            <span>Day 3</span>
          </div>
        </div>
        <div id="map"></div>
      </div>

      <div class="itinerary-section">
        <div class="day-content active" data-day="1">
          <h2 class="day-title">첫째 날: 하카타 도착 &amp; 미노시마 로컬 저녁</h2>
          <div class="activity-list" id="day1-activities"></div>
        </div>

        <div class="day-content" data-day="2">
          <h2 class="day-title">둘째 날: 오호리 공원의 정적과 텐진 미식</h2>
          <div class="activity-list" id="day2-activities"></div>
        </div>

        <div class="day-content" data-day="3">
          <h2 class="day-title">셋째 날: 공항 이동</h2>
          <div class="activity-list" id="day3-activities"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
